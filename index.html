<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO fx-991ES PLUS Natural-V.P.A.M.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Share+Tech+Mono&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="casio-body">
        <!-- Header -->
        <header class="top-banner">
            <div class="brand-block">
                <span class="brand-casio">CASIO</span>
                <span class="brand-model">fx-991ES PLUS</span>
                <span class="vpam-tag">NATURAL-V.P.A.M.</span>
            </div>
            <div class="solar-block">
                <span class="two-way-power">TWO WAY POWER</span>
                <div class="solar-grid">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </header>

        <!-- LCD Screen -->
        <section class="screen-bezel">
            <div class="lcd" id="lcd">
                <!-- Status Indicators -->
                <div class="lcd-flags">
                    <span class="flag" id="flag-s">S</span>
                    <span class="flag" id="flag-a">A</span>
                    <span class="flag" id="flag-m">M</span>
                    <span class="flag" id="flag-sto">STO</span>
                    <span class="flag" id="flag-rcl">RCL</span>
                    <span class="flag" id="flag-hyp">HYP</span>
                    <span class="flag on" id="flag-deg">D</span>
                    <span class="flag" id="flag-rad">R</span>
                    <span class="flag" id="flag-gra">G</span>
                    <span class="flag on" id="flag-math">Math</span>
                </div>

                <!-- 2-Line Input & Result Screen -->
                <div class="lcd-expr-row" id="expr-display">
                    <span class="cursor">_</span>
                </div>
                <div class="lcd-res-row" id="res-display">0</div>

                <!-- Mode Overlay Menu -->
                <div class="menu-overlay" id="menu-overlay">
                    <div>1: COMP&nbsp;&nbsp;&nbsp;&nbsp;2: CMPLX</div>
                    <div>3: STAT&nbsp;&nbsp;&nbsp;&nbsp;4: BASE-N</div>
                    <div>5: EQN&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;6: MATRIX</div>
                    <div>7: TABLE&nbsp;&nbsp;&nbsp;8: VECTOR</div>
                </div>
            </div>
        </section>

        <!-- Top Controls: SHIFT, ALPHA, REPLAY, MODE, ON -->
        <section class="control-row">
            <div class="top-pills">
                <button class="k pill" data-k="SHIFT"><span class="k-txt gold">SHIFT</span></button>
                <button class="k pill" data-k="ALPHA"><span class="k-txt ruby">ALPHA</span></button>
            </div>

            <div class="replay-chassis">
                <button class="arrow-key up" data-dir="UP">▲</button>
                <button class="arrow-key lf" data-dir="LF">◀</button>
                <span class="replay-txt">REPLAY</span>
                <button class="arrow-key rt" data-dir="RT">▶</button>
                <button class="arrow-key dn" data-dir="DN">▼</button>
            </div>

            <div class="top-pills">
                <button class="k pill" data-k="MODE"><span class="s-lbl">SETUP</span><span class="k-txt">MODE</span></button>
                <button class="k pill" data-k="ON"><span class="k-txt">ON</span></button>
            </div>
        </section>

        <!-- Scientific Function Matrix (24 Keys) -->
        <section class="sci-keys">
            <!-- Row 1 -->
            <button class="k f-key" data-k="CALC"><span class="s-lbl">SOLVE</span><span class="a-lbl">=</span><span class="k-txt">CALC</span></button>
            <button class="k f-key" data-k="INTG"><span class="s-lbl">d/dx</span><span class="a-lbl">:</span><span class="k-txt">∫dx</span></button>
            <button class="k f-key" data-k="INV"><span class="s-lbl">x!</span><span class="a-lbl">A</span><span class="k-txt">x⁻¹</span></button>
            <button class="k f-key" data-k="LOGAB"><span class="s-lbl">Σ</span><span class="a-lbl">B</span><span class="k-txt">log<sub>■</sub>■</span></button>
            <button class="k f-key" data-k="FRAC"><span class="s-lbl">Mixed</span><span class="a-lbl">C</span><span class="k-txt">■/□</span></button>
            <button class="k f-key" data-k="SQRT"><span class="s-lbl">∛</span><span class="a-lbl">D</span><span class="k-txt">√■</span></button>

            <!-- Row 2 -->
            <button class="k f-key" data-k="SQR"><span class="s-lbl">x³</span><span class="a-lbl">E</span><span class="k-txt">x²</span></button>
            <button class="k f-key" data-k="POW"><span class="s-lbl">ˣ√</span><span class="a-lbl">F</span><span class="k-txt">x<sup>■</sup></span></button>
            <button class="k f-key" data-k="LOG"><span class="s-lbl">10<sup>■</sup></span><span class="a-lbl">X</span><span class="k-txt">log</span></button>
            <button class="k f-key" data-k="LN"><span class="s-lbl">e<sup>■</sup></span><span class="a-lbl">Y</span><span class="k-txt">ln</span></button>
            <button class="k f-key" data-k="NEG"><span class="s-lbl"></span><span class="k-txt">(−)</span></button>
            <button class="k f-key" data-k="DMS"><span class="s-lbl">←</span><span class="k-txt">° ’ ”</span></button>

            <!-- Row 3 -->
            <button class="k f-key" data-k="HYP"><span class="k-txt">hyp</span></button>
            <button class="k f-key" data-k="SIN"><span class="s-lbl">sin⁻¹</span><span class="k-txt">sin</span></button>
            <button class="k f-key" data-k="COS"><span class="s-lbl">cos⁻¹</span><span class="k-txt">cos</span></button>
            <button class="k f-key" data-k="TAN"><span class="s-lbl">tan⁻¹</span><span class="k-txt">tan</span></button>
            <button class="k f-key" data-k="RCL"><span class="s-lbl">STO</span><span class="k-txt">RCL</span></button>
            <button class="k f-key" data-k="ENG"><span class="s-lbl">←</span><span class="k-txt">ENG</span></button>

            <!-- Row 4 -->
            <button class="k f-key" data-k="("><span class="k-txt">(</span></button>
            <button class="k f-key" data-k=")"><span class="a-lbl">X</span><span class="k-txt">)</span></button>
            <button class="k f-key" data-k="SD"><span class="k-txt">S⇔D</span></button>
            <button class="k f-key" data-k="M_PLUS"><span class="s-lbl">M−</span><span class="a-lbl">M</span><span class="k-txt">M+</span></button>
            <button class="k f-key" data-k="CONST"><span class="s-lbl">CONST</span><span class="k-txt">CNST</span></button>
            <button class="k f-key" data-k="CONV"><span class="s-lbl">CONV</span><span class="k-txt">CONV</span></button>
        </section>

        <!-- Numeric & Execution Keypad (20 Keys) -->
        <section class="num-keys">
            <!-- Row 1 -->
            <button class="k n-key" data-k="7"><span class="k-txt">7</span></button>
            <button class="k n-key" data-k="8"><span class="k-txt">8</span></button>
            <button class="k n-key" data-k="9"><span class="k-txt">9</span></button>
            <button class="k n-key del-ac" data-k="DEL"><span class="s-lbl">INS</span><span class="k-txt">DEL</span></button>
            <button class="k n-key del-ac" data-k="AC"><span class="s-lbl">OFF</span><span class="k-txt">AC</span></button>

            <!-- Row 2 -->
            <button class="k n-key" data-k="4"><span class="k-txt">4</span></button>
            <button class="k n-key" data-k="5"><span class="k-txt">5</span></button>
            <button class="k n-key" data-k="6"><span class="k-txt">6</span></button>
            <button class="k n-key" data-k="MUL"><span class="s-lbl">nPr</span><span class="k-txt">×</span></button>
            <button class="k n-key" data-k="DIV"><span class="s-lbl">nCr</span><span class="k-txt">÷</span></button>

            <!-- Row 3 -->
            <button class="k n-key" data-k="1"><span class="k-txt">1</span></button>
            <button class="k n-key" data-k="2"><span class="k-txt">2</span></button>
            <button class="k n-key" data-k="3"><span class="k-txt">3</span></button>
            <button class="k n-key" data-k="ADD"><span class="s-lbl">Pol</span><span class="k-txt">+</span></button>
            <button class="k n-key" data-k="SUB"><span class="s-lbl">Rec</span><span class="k-txt">−</span></button>

            <!-- Row 4 -->
            <button class="k n-key" data-k="0"><span class="s-lbl">Rnd</span><span class="k-txt">0</span></button>
            <button class="k n-key" data-k="DOT"><span class="s-lbl">Ran#</span><span class="a-lbl">RanInt</span><span class="k-txt">•</span></button>
            <button class="k n-key" data-k="EXP"><span class="s-lbl">π</span><span class="a-lbl">e</span><span class="k-txt">×10<sup>x</sup></span></button>
            <button class="k n-key" data-k="ANS"><span class="s-lbl">%</span><span class="k-txt">Ans</span></button>
            <button class="k n-key" data-k="EXE"><span class="k-txt">=</span></button>
        </section>
    </main>

    <!-- ========================================================
         HIGH-PRECISION MATH & CASIO EXECUTION ENGINE
         ======================================================== -->
    <script src="script.js"></script>
</body>
</html>
